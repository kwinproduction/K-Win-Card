  <style>
    :root {
      --primary-accent: #00f2ff;
      --blue: #0062ff;
      --dark-bg: #050a14;
      --glass: rgba(255, 255, 255, 0.08);
      --border: rgba(0, 242, 255, 0.2);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; position: fixed;
    }

    body {
      background: var(--dark-bg);
      color: white;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.15;
      animation: move 15s infinite alternate ease-in-out;
    }

    .orb-1 { width: 300px; height: 300px; background: var(--primary-accent); top: -50px; right: -50px; }
    .orb-2 { width: 400px; height: 400px; background: var(--blue); bottom: -100px; left: -50px; }

    @keyframes move {
      from { transform: translate(0,0); }
      to { transform: translate(30px, 40px); }
    }

    .top-bar {
      margin-bottom: 10px;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    .lang-switch {
      display: flex;
      background: var(--glass);
      padding: 4px;
      border-radius: 50px;
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .lang-btn {
      background: none;
      border: none;
      color: #888;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: bold;
      transition: 0.3s;
    }

    .lang-btn.active {
      background: var(--primary-accent);
      color: #000;
    }

    .card {
      width: 90%;
      max-width: 380px;
      background: rgba(10, 20, 40, 0.7);
      backdrop-filter: blur(25px);
      border-radius: 30px;
      padding: 20px 18px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .card::-webkit-scrollbar { display: none; }

    h1 {
      font-size: 1.6rem;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 15px;
      text-transform: uppercase;
      font-weight: 800;
    }

    .p-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--primary-accent);
      padding: 4px;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .info-box {
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 18px;
      margin-bottom: 15px;
      text-align: left;
      border-left: 4px solid var(--primary-accent);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .section-title {
      font-size: 0.75rem;
      color: var(--primary-accent);
      margin: 15px 0 10px;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 1.5px;
      opacity: 0.7;
    }

    .section-title::before,
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      border-radius: 15px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-main:active { transform: scale(0.96); }

    .btn-accent { background: var(--primary-accent); color: #000; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-glass { background: var(--glass); color: #fff; border: 1px solid var(--border); }
    .btn-wa { background: #128C7E; color: white; }
    .btn-map { background: #34a853; color: white; }

    .dropdown { position: relative; width: 100%; }
    .dropdown-content {
      display: none;
      position: absolute;
      background: white;
      width: 100%;
      border-radius: 12px;
      z-index: 1000;
      bottom: 110%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .dropdown-content a {
      color: #000;
      padding: 12px;
      text-decoration: none;
      display: block;
      font-size: 0.85rem;
      border-bottom: 1px solid #eee;
      font-weight: 600;
    }

    .show { display: block !important; animation: slideUp 0.3s ease; }

    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .grid-btn {
      background: var(--glass);
      padding: 10px 5px;
      border-radius: 15px;
      text-decoration: none;
      color: #ccc;
      font-size: 0.6rem;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .grid-btn img {
      width: 22px;
      height: 22px;
      margin-bottom: 5px;
    }

    #pwa-installer {
      display: none;
      position: fixed;
      top: 10px;
      width: 90%;
      max-width: 380px;
      background: var(--primary-accent);
      color: #000;
      padding: 12px;
      border-radius: 50px;
      z-index: 9999;
      text-align: center;
      font-weight: 800;
      font-size: 0.8rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.6rem;
      opacity: 0.4;
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }

    /* In-App Notification Toast */
    .in-app-toast {
      position: fixed;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 360px;
      background: rgba(5, 10, 20, 0.9);

      border-radius: 20px;

      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 15px 40px rgba(0, 242, 255, 0.3);
      z-index: 100000;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      opacity: 0;
    }

    .in-app-toast.show {
      top: 20px;
      opacity: 1;
    }

    .in-app-toast-icon {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid var(--primary-accent);
      object-fit: cover;
    }

    .in-app-toast-content {
      flex-grow: 1;
      text-align: left;
    }

    .in-app-toast-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 3px;
    }

    .in-app-toast-body {
      font-size: 0.75rem;
      color: #ccc;
      line-height: 1.35;
    }

    .in-app-toast-close {
      background: none;
      border: none;
      color: #ff4d4d;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 5px;
      font-weight: bold;

        ttWeek: "ඉරිදා සිට සිකුරාදා: පෙ.ව. 08:30 සිට ප.ව. 04:00 දක්වා",

      },

        tt: "திறந்திருக்கும் நேரங்கள்",
        share: "பகிருங்கள்",
        close: "மூடு",
        addr: "📍 குருநாகல், இலங்கை",
        call: "அழைப்பு",
        map: "செல்லுங்கள்",
        sms: "செய்தி",
        footer: "✨ K-Win மூலம் | ஜனித் திதுல",
        pwa: "K-Win செயலியை நிறுவுங்கள்",
        hContact: "தொடர்பு கொள்ள",
        hSocial: "சமூக ஊடகங்கள்",
        hOther: "மற்றவை",

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + lang);
      if (activeBtn) activeBtn.classList.add('active');

      document.getElementById('txt-save').innerText = t.save;
      document.getElementById('txt-tt').innerText = t.tt;
      document.getElementById('txt-share').innerText = t.share;
      document.getElementById('lbl-addr').innerText = t.addr;

      document.getElementById('head-contact').innerText = t.hContact;
      document.getElementById('head-social').innerText = t.hSocial;
      document.getElementById('head-other').innerText = t.hOther;
    }

      const menu = document.getElementById(id);
      const isShown = menu.classList.contains('show');
      document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));

    function openTimetable() {
      const t = translations[currentLang];
      const ttHtml = `
        <div id="tt-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); z-index:10000; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.3s;">

            <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:15px; margin-bottom:10px; border-left:4px solid var(--primary-accent); text-align:left;">
              <p style="margin:0; font-size:0.9rem; line-height:1.6;">${t.ttWeek}</p>
            </div>
            <div style="background:rgba(255,0,0,0.1); padding:15px; border-radius:15px; margin-bottom:20px; border-left:4px solid #ff4d4d; text-align:left;">
              <p style="margin:0; font-size:0.9rem; color:#ff4d4d;">${t.ttSat}</p>
            </div>
            <button onclick="closeTimetable()" class="btn-main btn-accent">${t.close}</button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', ttHtml);
    }

    function closeTimetable() {
      const overlay = document.getElementById('tt-overlay');
      if (overlay) overlay.remove();
    }

    function saveVCard() {
      const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:Kind Win\nTEL:0707140731\nEMAIL:kindwin2026@gmail.com\nEND:VCARD";
      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'KindWin_Contact.vcf';
      a.click();
      window.URL.revokeObjectURL(url);

      localStorage.setItem('kwin_contact_saved', 'true');
      checkStatus();
    }

    function checkStatus() {
      if (localStorage.getItem('kwin_contact_saved') === 'true') {
        document.getElementById('mainSaveBtn').style.display = 'none';
        document.getElementById('contactSection').style.display = 'block';
      }
    }

    async function shareCard() {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'K-Win',
            text: 'K-Win Digital Card',
            url: window.location.href
          });
        } catch (err) {}
      } else {
        alert("Sharing not supported");
      }
    }

    // --- Web Audio API Chime ---
    function playNotificationSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain1.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start();
        osc1.stop(audioCtx.currentTime + 0.35);
        setTimeout(() => {
          const osc2 = audioCtx.createOscillator();
          const gain2 = audioCtx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(880.00, audioCtx.currentTime);
          gain2.gain.setValueAtTime(0.18, audioCtx.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.55);
          osc2.connect(gain2);
          gain2.connect(audioCtx.destination);
          osc2.start();
          osc2.stop(audioCtx.currentTime + 0.55);
        }, 75);
      } catch (e) {
        console.warn("Web Audio chime not supported:", e);
      }
    }

    // --- In-App Toast ---
    function showInAppNotification(title, message) {
      playNotificationSound();
      const existing = document.getElementById('in-app-toast');
      if (existing) existing.remove();

      const toastHtml = `
        <div id="in-app-toast" class="in-app-toast">
          <img src="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg" class="in-app-toast-icon" alt="Logo">
          <div class="in-app-toast-content">
            <div class="in-app-toast-title">${title || 'Kind Win'}</div>
            <div class="in-app-toast-body">${message || ''}</div>
          </div>
          <button class="in-app-toast-close" onclick="closeInAppNotification()">×</button>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', toastHtml);
      setTimeout(() => {
        const toast = document.getElementById('in-app-toast');
        if (toast) toast.classList.add('show');
      }, 50);
      setTimeout(() => { closeInAppNotification(); }, 6000);
    }

    function closeInAppNotification() {
      const toast = document.getElementById('in-app-toast');
      if (toast) {
        toast.classList.remove('show');
        setTimeout(() => { toast.remove(); }, 400);
      }
    }

    // --- 🔔 OneSignal Init & Permission Prompt ---
    function initOneSignal() {
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "ebdc2cd4-a21d-434f-ab63-d60f21ad3295",
          allowLocalhostAsSecureOrigin: true, // Localhost වල ටෙස්ට් කිරීමට පහසු කරයි
          notifyButton: { enable: false }
        });

        // 1. User ඇප් එකට ආපු ගමන් Notification Permission ඉල්ලන Popup එක Trigger කිරීම
        if (OneSignal.Notifications.permissionNative !== "granted") {
          setTimeout(async () => {
            await OneSignal.Notifications.requestPermission();
          }, 2000); // තත්පර 2කින් Popup එක පෙන්වයි
        }

        // Foreground (ඇප් එක ඇරලා තියෙද්දී) Notification හැසිරවීම
        OneSignal.Notifications.addEventListener("foregroundWillDisplay", function(event) {
          event.preventDefault(); // Default OS banner එක නවතා In-app toast එක පෙන්වයි
          const title = event.notification.title;
          const body = event.notification.body;
          showInAppNotification(title, body);
        });
      });
    }

    // --- ⚙️ Init & Service Worker Registration ---
    window.onload = () => {
      setLanguage('en');
      checkStatus();
      initOneSignal();

      // 2. සර්විස් වර්කර් එක (sw.js) බ්‍රවුසර් එකට Register කිරීම (Background Notifications සඳහා අනිවාර්යයි)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('K-Win Service Worker Registered Successfully!', reg))
          .catch((err) => console.error('Service Worker Registration Failed:', err));
      }
    };

    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.card') || e.target.closest('.in-app-toast')) return;
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-installer').style.display = 'block';
    });

    async function handleInstallClick() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('pwa-installer').style.display = 'none';
        }
        deferredPrompt = null;
      }
    }
  </script>
</body>
</html>
