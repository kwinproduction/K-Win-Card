  <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg" />
  <meta name="theme-color" content="#00f2ff" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root {
      --primary-accent: #00f2ff;
      --blue: #0062ff;
      --dark-bg: #050a14;
      --glass: rgba(255, 255, 255, 0.08);
      --border: rgba(0, 242, 255, 0.2);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; position: fixed;
    }

    body {
      background: var(--dark-bg);
      color: white;
      font-family: 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      opacity: 0.15;
      animation: move 15s infinite alternate ease-in-out;
    }
    .orb-1 { width: 300px; height: 300px; background: var(--primary-accent); top: -50px; right: -50px; }
    .orb-2 { width: 400px; height: 400px; background: var(--blue); bottom: -100px; left: -50px; }

    @keyframes move {
      from { transform: translate(0,0); }
      to { transform: translate(30px, 40px); }
    }

    .top-bar { margin-bottom: 10px; width: 100%; display: flex; justify-content: center; z-index: 10; }
    .lang-switch {
      display: flex;
      background: var(--glass);
      padding: 4px;
      border-radius: 50px;
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .lang-btn {
      background: none;
      border: none;
      color: #888;
      padding: 6px 14px;
      cursor: pointer;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: bold;
      transition: 0.3s;
    }
    .lang-btn.active { background: var(--primary-accent); color: #000; }

    .card {
      width: 90%;
      max-width: 380px;
      background: rgba(10, 20, 40, 0.7);
      backdrop-filter: blur(25px);
      border-radius: 30px;
      padding: 20px 18px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      max-height: 90vh;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .card::-webkit-scrollbar { display: none; }

    h1 {
      font-size: 1.6rem;
      color: #ffffff;
      letter-spacing: 1px;
      margin-bottom: 15px;
      text-transform: uppercase;
      font-weight: 800;
    }
    .p-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid var(--primary-accent);
      padding: 4px;
      object-fit: cover;
      margin-bottom: 15px;
    }

    .info-box {
      background: rgba(0,0,0,0.4);
      padding: 15px;
      border-radius: 18px;
      margin-bottom: 15px;
      text-align: left;
      border-left: 4px solid var(--primary-accent);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    .section-title {
      font-size: 0.75rem;
      color: var(--primary-accent);
      margin: 15px 0 10px;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 1.5px;
      opacity: 0.7;
    }
    .section-title::before, .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .btn-main {
      width: 100%;
      padding: 12px;
      border-radius: 15px;
      border: none;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .btn-main:active { transform: scale(0.96); }

    .btn-accent { background: var(--primary-accent); color: #000; }
    .btn-blue { background: var(--blue); color: #fff; }
    .btn-glass { background: var(--glass); color: #fff; border: 1px solid var(--border); }
    .btn-wa { background: #128C7E; color: white; }
    .btn-map { background: #34a853; color: white; }

    .dropdown { position: relative; width: 100%; }
    .dropdown-content {
      display: none;
      position: absolute;
      background: white;
      width: 100%;
      border-radius: 12px;
      z-index: 1000;
      bottom: 110%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .dropdown-content a {
      color: #000;
      padding: 12px;
      text-decoration: none;
      display: block;
      font-size: 0.85rem;
      border-bottom: 1px solid #eee;
      font-weight: 600;
    }
    .show { display: block !important; animation: slideUp 0.3s ease; }

    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .grid-btn {
      background: var(--glass);
      padding: 10px 5px;
      border-radius: 15px;
      text-decoration: none;
      color: #ccc;
      font-size: 0.6rem;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .grid-btn img { width: 22px; height: 22px; margin-bottom: 5px; }

    #pwa-installer {
      display: none;
      position: fixed;
      top: 10px;
      width: 90%;
      max-width: 380px;
      background: var(--primary-accent);
      color: #000;
      padding: 12px;
      border-radius: 50px;
      z-index: 9999;
      text-align: center;
      font-weight: 800;
      font-size: 0.8rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .footer {
      margin-top: 20px;
      font-size: 0.6rem;
      opacity: 0.4;
      color: #fff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideDown {
      from { transform: translate(-50%, -30px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .live-toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 420px;
      background: rgba(18, 140, 126, 0.98);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      border-radius: 18px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      z-index: 100000;
      padding: 14px 16px;
      display: none;
      animation: slideDown 0.25s ease;
    }

    .live-toast .title {
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.2px;
      margin-bottom: 4px;
    }

    .live-toast .message {
      font-size: 0.92rem;
      line-height: 1.35;
      word-break: break-word;
    }

    .live-toast .small {
      opacity: 0.85;
      font-size: 0.72rem;
      margin-top: 6px;
    }

    .push-btn-wrap {
      margin: 8px 0 2px;
    }
  </style>
</head>
<body>
  <div id="pwa-installer" onclick="handleInstallClick()">📲 <span id="pwa-text">Install K-Win App</span></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="top-bar">
    <div class="lang-switch">
      <button id="btn-si" class="lang-btn" onclick="setLanguage('si')">සිංහල</button>
      <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">English</button>
      <button id="btn-ta" class="lang-btn" onclick="setLanguage('ta')">தமிழ்</button>
    </div>
  </div>

  <div class="card">
    <h1>Kind Win</h1>
    <img src="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg" class="p-img" alt="Logo">

    <div class="info-box">
      <span id="lbl-addr">📍 Kurunegala, Sri Lanka</span><br>
      <span>📞 071 733 7818</span><br>
      <span>📧 kindwin2026@gmail.com</span>
    </div>

    <button id="mainSaveBtn" onclick="saveVCard()" class="btn-main btn-accent">
      👤 <span id="txt-save">SAVE CONTACT</span>
    </button>

    <div id="contactSection" style="display: none;">
      <div class="section-title" id="head-contact">Contact Us</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button class="btn-main btn-wa" onclick="window.location.href='https://wa.me/94707140731'">✅ WhatsApp</button>
        <button class="btn-main btn-glass" style="background:#e74c3c" onclick="location.href='mailto:kindwin2026@gmail.com'">📧 Email</button>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <div class="dropdown">
          <button class="btn-main btn-blue" onclick="toggleMenu('callMenu')">📞 <span id="txt-call">Call</span></button>
          <div id="callMenu" class="dropdown-content">
            <a href="tel:0717337818">Sadeepa</a>
            <a href="tel:0714073730">Kevin</a>
          </div>
        </div>
        <div class="dropdown">
          <button class="btn-main btn-glass" style="background:#f39c12; color:#000" onclick="toggleMenu('smsMenu')">💬 <span id="txt-sms">SMS</span></button>
          <div id="smsMenu" class="dropdown-content">
            <a href="sms:0717337818">Sadeepa</a>
            <a href="sms:0714073730">Kevin</a>
          </div>
        </div>
      </div>
    </div>

    <div class="section-title" id="head-other">Other Services</div>
    <button onclick="openTimetable()" class="btn-main btn-blue">📅 <span id="txt-tt">Opening Hours</span></button>

    <div style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px;">
      <button class="btn-main btn-map" onclick="window.open('https://maps.app.goo.gl/Ps6yVU6ytJjZexY98')">🗺️ <span id="txt-map">Go to K-Win</span></button>
      <button onclick="shareCard()" class="btn-main btn-glass">➡️ <span id="txt-share">Share</span></button>
    </div>

    <div class="section-title" id="head-social">Social Media</div>
    <div class="social-grid">
      <a href="https://facebook.com/profile.php?id=61569786773421" class="grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"><span>Facebook</span></a>
      <a href="https://www.youtube.com/@KindWin_18" class="grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"><span>YouTube</span></a>
      <a href="https://kwinproduction.github.io/K-Win/" class="grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/1006/1006771.png" alt="Internet"><span>Kind Win Web</span></a>
      <a href="#" class="grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"><span>Instagram</span></a>
    </div>

    <div class="footer" id="txt-footer">✨ Powered by K-Win | Created by Janith Didula</div>
  </div>

  <div id="liveToast" class="live-toast" aria-live="polite">
    <div class="title" id="toastTitle">K-Win Notification</div>
    <div class="message" id="toastMessage"></div>
    <div class="small" id="toastSmall">New message received</div>
  </div>

  <script>
    let currentLang = 'en';
    let deferredPrompt = null;
    let toastTimer = null;
    let oneSignalInstance = null;

    const translations = {
      en: {
        save: 'SAVE CONTACT', tt: 'Opening Hours', share: 'Share', close: 'Close',
        addr: '📍 Kurunegala, Sri Lanka', call: 'Call', map: 'Go to K-Win', sms: 'SMS',
        footer: '✨ Powered by K-Win | Created by Janith Didula', pwa: 'Install K-Win App',
        push: 'Enable Notifications', hContact: 'Contact Us', hSocial: 'Social Media', hOther: 'Other Services',
        ttTitle: 'K-Win Opening Hours', ttWeek: 'Sunday to Friday: 08:30 AM - 04:00 PM', ttSat: 'Saturday: Closed',
        toastTitle: 'K-Win Notification', toastSmall: 'New message received'
      },
      si: {
        save: 'CONTACT එක SAVE කරන්න', tt: 'විවෘතව තබන වේලාවන්', share: 'බෙදාගන්න', close: 'වසා දමන්න',
        addr: '📍 කුරුණෑගල, ශ්‍රී ලංකා', call: 'ඇමතුම්', map: 'ගමන් මාර්ගය', sms: 'පණිවිඩ',
        footer: '✨ K-Win වෙතින් | ජනිත් දිදුලගේ නිර්මාණයකි', pwa: 'K-Win App එක Install කරගන්න',
        push: 'Notifications දාන්න', hContact: 'අපව සම්බන්ධ කරගන්න', hSocial: 'සමාජ මාධ්‍ය', hOther: 'අමතර සේවා',
        ttTitle: 'විවෘතව තබන වේලාවන්', ttWeek: 'ඉරිදා සිට සිකුරාදා: පෙ.ව. 08:30 සිට ප.ව. 04:00 දක්වා', ttSat: 'සෙනසුරාදා දින: ආයතනය වසා ඇත',
        toastTitle: 'K-Win දැනුම්දීම', toastSmall: 'නව පණිවිඩයක් ලැබුණා'
      },
      ta: {
        save: 'தொடர்பைச் சேமிக்கவும்', tt: 'திறந்திருக்கும் நேரங்கள்', share: 'பகிரவும்', close: 'மூடு',
        addr: '📍 குருநாகல், இலங்கை', call: 'அழைப்பு', map: 'செல்லுங்கள்', sms: 'செய்தி',
        footer: '✨ K-Win மூலம் | ஜனித் திதுல', pwa: 'K-Win செயலியை நிறுவுங்கள்',
        push: 'அறிவிப்புகளை இயக்கவும்', hContact: 'தொடர்பு கொள்ள', hSocial: 'சமூக ஊடகங்கள்', hOther: 'மற்றவை',
        ttTitle: 'திறந்திருக்கும் நேரங்கள்', ttWeek: 'ஞாயிறு முதல் வெள்ளி: 08:30 AM - 04:00 PM', ttSat: 'சனிக்கிழமை: மூடப்பட்டுள்ளது',
        toastTitle: 'K-Win அறிவிப்பு', toastSmall: 'புதிய செய்தி வந்தது'
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('btn-' + lang);
      if (btn) btn.classList.add('active');

      const t = translations[lang];
      document.getElementById('txt-save').innerText = t.save;
      document.getElementById('txt-tt').innerText = t.tt;
      document.getElementById('txt-share').innerText = t.share;
      document.getElementById('lbl-addr').innerText = t.addr;
      document.getElementById('txt-call').innerText = t.call;
      document.getElementById('txt-map').innerText = t.map;
      document.getElementById('txt-sms').innerText = t.sms;
      document.getElementById('txt-footer').innerText = t.footer;
      document.getElementById('pwa-text').innerText = t.pwa;
      document.getElementById('txt-push').innerText = t.push;
      document.getElementById('head-contact').innerText = t.hContact;
      document.getElementById('head-social').innerText = t.hSocial;
      document.getElementById('head-other').innerText = t.hOther;
      document.getElementById('toastTitle').innerText = t.toastTitle;
      document.getElementById('toastSmall').innerText = t.toastSmall;
    }

    function toggleMenu(id) {
      const menu = document.getElementById(id);
      const isShown = menu.classList.contains('show');
      document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));
      if (!isShown) menu.classList.add('show');
    }

    function openTimetable() {
      const t = translations[currentLang];
      const ttHtml = `
        <div id="tt-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter:blur(10px); z-index:10000; display:flex; align-items:center; justify-content:center; animation:fadeIn 0.3s;">
          <div style="background:var(--dark-bg); border:1px solid var(--primary-accent); padding:30px; border-radius:25px; width:90%; max-width:350px; text-align:center;">
            <div style="color:var(--primary-accent); font-weight:bold; margin-bottom:20px; font-size:1.1rem;">${t.ttTitle}</div>
            <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:15px; margin-bottom:10px; border-left:4px solid var(--primary-accent); text-align:left;">
              <p style="margin:0; font-size:0.9rem; line-height:1.6;">${t.ttWeek}</p>
            </div>
            <div style="background:rgba(255,0,0,0.1); padding:15px; border-radius:15px; margin-bottom:20px; border-left:4px solid #ff4d4d; text-align:left;">
              <p style="margin:0; font-size:0.9rem; color:#ff4d4d;">${t.ttSat}</p>
            </div>
            <button onclick="closeTimetable()" class="btn-main btn-accent">${t.close}</button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', ttHtml);
    }

    function closeTimetable() {
      const overlay = document.getElementById('tt-overlay');
      if (overlay) overlay.remove();
    }

    function saveVCard() {
      const vcard = 'BEGIN:VCARD\nVERSION:3.0\nFN:Kind Win\nTEL:0707140731\nEMAIL:kindwin2026@gmail.com\nEND:VCARD';
      const blob = new Blob([vcard], { type: 'text/vcard' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'KindWin_Contact.vcf';
      a.click();
      URL.revokeObjectURL(url);
      localStorage.setItem('kwin_contact_saved', 'true');
      checkStatus();
    }

    function checkStatus() {
      if (localStorage.getItem('kwin_contact_saved') === 'true') {
        document.getElementById('mainSaveBtn').style.display = 'none';
        document.getElementById('contactSection').style.display = 'block';
      }
    }

    async function shareCard() {
      if (navigator.share) {
        try {
          await navigator.share({ title: 'K-Win', text: 'K-Win Digital Card', url: window.location.href });
        } catch (err) {}
      } else {
        alert('Sharing not supported');
      }
    }

    document.addEventListener('touchmove', (e) => {
      if (e.target.closest('.card')) return;
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('click', (e) => {
      if (e.target.closest('.btn-main') || e.target.tagName === 'BUTTON') {
        if (navigator.vibrate) navigator.vibrate(40);
      }
      const insideDropdown = e.target.closest('.dropdown');
      if (!insideDropdown) document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));
    });

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-installer').style.display = 'block';
    });

    async function handleInstallClick() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('pwa-installer').style.display = 'none';
        }
        deferredPrompt = null;
      }
    }

    function showToast(message) {
      const toast = document.getElementById('liveToast');
      document.getElementById('toastMessage').innerText = message;
      toast.style.display = 'block';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.style.display = 'none';
      }, 4500);
    }

    function playTone() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const o1 = ctx.createOscillator();
        const g1 = ctx.createGain();
        o1.type = 'sine';
        o1.frequency.value = 880;
        g1.gain.value = 0.0001;
        o1.connect(g1);
        g1.connect(ctx.destination);
        o1.start();
        g1.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
        g1.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
        o1.stop(ctx.currentTime + 0.38);
      } catch (e) {}
    }

    async function enablePushNotifications() {
      if (!oneSignalInstance) {
        alert('OneSignal loading... please try again');
        return;
      }

      try {
        await oneSignalInstance.Notifications.requestPermission();
        alert('Notifications enabled');
      } catch (err) {
        console.error('Push permission error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      setLanguage('en');
      checkStatus();

      const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
      if (!isStandalone && isIos) {
        document.getElementById('pwa-installer').style.display = 'block';
      }

      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function (OneSignal) {
        try {
          oneSignalInstance = OneSignal;

          await OneSignal.init({
            appId: 'ebdc2cd4-a21d-434f-ab63-d60f21ad3295',
            notifyButton: { enable: false }
          });

          OneSignal.Notifications.addEventListener('foregroundWillDisplay', (event) => {
            const notification = event?.notification;
            const title = notification?.title || 'K-Win Notification';
            const message = notification?.body || '';
            if (message) {
              document.getElementById('toastTitle').innerText = title;
              showToast(message);
              playTone();
            }
          });

          OneSignal.Notifications.addEventListener('click', () => {
            window.focus();
          });

          const permission = OneSignal.Notifications.permission;
          document.getElementById('enablePushBtn').style.display = permission === 'granted' ? 'none' : 'block';
        } catch (err) {
          console.error('OneSignal init error:', err);
        }
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Fail', err));
      }
    });
    let oneSignalInstance = null;

  window.OneSignalDeferred = window.OneSignalDeferred || [];
  window.OneSignalDeferred.push(async function (OneSignal) {
    try {
      oneSignalInstance = OneSignal;

      await OneSignal.init({
        appId: 'ebdc2cd4-a21d-434f-ab63-d60f21ad3295',
        notifyButton: { enable: false }
      });

      // Foreground notification event
      OneSignal.Notifications.addEventListener('foregroundWillDisplay', (event) => {
        const notification = event?.notification;
        const title = notification?.title || 'K-Win Notification';
        const message = notification?.body || '';

        if (message) {
          document.getElementById('toastTitle').innerText = title;
          document.getElementById('toastMessage').innerText = message;
          document.getElementById('liveToast').style.display = 'block';

          clearTimeout(window.toastTimer);
          window.toastTimer = setTimeout(() => {
            document.getElementById('liveToast').style.display = 'none';
          }, 4500);

          if (window.navigator.vibrate) window.navigator.vibrate(40);
        }
      });

      OneSignal.Notifications.addEventListener('click', () => {
        window.focus();
      });

      const permission = OneSignal.Notifications.permission;
      document.getElementById('enablePushBtn').style.display =
        permission === 'granted' ? 'none' : 'block';

    } catch (err) {
      console.error('OneSignal init error:', err);
    }
  });

  async function enablePushNotifications() {
    if (!oneSignalInstance) {
      alert('OneSignal loading... please try again');
      return;
    }

    try {
      await oneSignalInstance.Notifications.requestPermission();
      alert('Notifications enabled');
      document.getElementById('enablePushBtn').style.display = 'none';
    } catch (err) {
      console.error('Push permission error:', err);
    }
  }
  </script>
</body>
