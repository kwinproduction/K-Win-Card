        /* ===== In-app Notification Popup ===== */
.inapp-notif {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%) translateY(-140%);
    width: min(92%, 380px);
    background: rgba(18, 24, 38, 0.96);
    border: 1px solid rgba(0, 242, 255, 0.25);
    border-radius: 22px;
    padding: 14px;
    z-index: 100000;
    box-shadow: 0 20px 45px rgba(0,0,0,0.55);
    backdrop-filter: blur(16px);
    transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.35s ease;
    opacity: 0;
    pointer-events: none;
}

.inapp-notif.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    pointer-events: auto;
}

.inapp-notif-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.inapp-icon {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    object-fit: cover;
    border: 1px solid rgba(255,255,255,0.1);
    background: #0f1726;
}

.inapp-meta {
    flex: 1;
    min-width: 0;
    text-align: left;
}

.inapp-appname {
    font-size: 0.75rem;
    font-weight: 800;
    letter-spacing: 0.6px;
    color: #25d366;
    text-transform: uppercase;
    line-height: 1.2;
}

.inapp-time {
    font-size: 0.64rem;
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
}

.inapp-title {
    font-size: 0.95rem;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 4px;
    text-align: left;
}

.inapp-message {
    font-size: 0.82rem;
    color: rgba(255,255,255,0.82);
    line-height: 1.5;
    text-align: left;
    word-break: break-word;
}

.inapp-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.inapp-btn {
    flex: 1;
    border: none;
    border-radius: 14px;
    padding: 10px 12px;
    font-weight: 800;
    cursor: pointer;
    font-size: 0.8rem;
}

.inapp-btn.close {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.08);
}

.inapp-btn.open {
    background: var(--primary-accent);
    color: #000;
}
/* Real-looking WhatsApp Heads-up Notification */
.wa-notif-container {
    position: fixed; 
    top: -150px; 
    left: 50%; 
    transform: translateX(-50%);
    width: 92%; 
    max-width: 360px; 
    background: #202c33; 
    border-radius: 16px; 
    padding: 12px 14px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); 
    z-index: 100000;
    transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex; 
    flex-direction: column; 
    gap: 6px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}
.wa-notif-container.popup-show { top: 12px; }
.wa-notif-header { display: flex; align-items: center; gap: 6px; font-size: 0.65rem; color: #8696a0; font-weight: bold; letter-spacing: 0.5px; }
.wa-app-icon { width: 14px; height: 14px; }
.wa-app-name { flex: 1; text-transform: uppercase; color: #25d366; }
.wa-time { font-weight: normal; opacity: 0.8; }
.wa-notif-body { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
.wa-profile-pic { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #0a101d; border: 1px solid rgba(255,255,255,0.1); }
.wa-notif-text { flex: 1; display: flex; flex-direction: column; text-align: left; overflow: hidden; }
.wa-sender { font-size: 0.85rem; font-weight: 700; color: #e9edef; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wa-message { font-size: 0.8rem; color: #d1d7db; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        /* Background Orbs */
        .orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.15; animation: move 15s infinite alternate ease-in-out; }
        .orb-1 { width: 300px; height: 300px; background: var(--primary-accent); top: -50px; right: -50px; }
        .orb-2 { width: 400px; height: 400px; background: var(--blue); bottom: -100px; left: -50px; }
        @keyframes move { from { transform: translate(0,0); } to { transform: translate(30px, 40px); } }

        .top-bar { margin-bottom: 10px; width: 100%; display: flex; justify-content: center; z-index: 10; }
        .lang-switch { display: flex; background: var(--glass); padding: 4px; border-radius: 50px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .lang-btn { background: none; border: none; color: #888; padding: 6px 14px; cursor: pointer; border-radius: 50px; font-size: 0.7rem; font-weight: bold; transition: 0.3s; }
        .lang-btn.active { background: var(--primary-accent); color: #000; }

        .card {
            width: 90%; max-width: 380px; background: rgba(10, 20, 40, 0.7); backdrop-filter: blur(25px);
            border-radius: 30px; padding: 20px 18px; border: 1px solid var(--border); text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-height: 90vh; overflow-y: auto; scrollbar-width: none;
        }
        .card::-webkit-scrollbar { display: none; }

        h1 { font-size: 1.6rem; color: #ffffff; letter-spacing: 1px; margin-bottom: 15px; text-transform: uppercase; font-weight: 800; }
        .p-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary-accent); padding: 4px; object-fit: cover; margin-bottom: 15px; }

        .info-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 18px; margin-bottom: 15px; text-align: left; border-left: 4px solid var(--primary-accent); font-size: 0.8rem; line-height: 1.6; }

        .section-title { font-size: 0.75rem; color: var(--primary-accent); margin: 15px 0 10px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: 1.5px; opacity: 0.7; }
        .section-title::before, .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

        .btn-main { width: 100%; padding: 12px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .btn-main:active { transform: scale(0.96); }

        .btn-accent { background: var(--primary-accent); color: #000; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-glass { background: var(--glass); color: #fff; border: 1px solid var(--border); }
        .btn-wa { background: #128C7E; color: white; }
        .btn-map { background: #34a853; color: white; }

        /* Dropdowns */
        .dropdown { position: relative; width: 100%; }
        .dropdown-content { display: none; position: absolute; background: white; width: 100%; border-radius: 12px; z-index: 1000; bottom: 110%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .dropdown-content a { color: #000; padding: 12px; text-decoration: none; display: block; font-size: 0.85rem; border-bottom: 1px solid #eee; font-weight: 600; }
        .show { display: block !important; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .social-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .grid-btn { background: var(--glass); padding: 10px 5px; border-radius: 15px; text-decoration: none; color: #ccc; font-size: 0.6rem; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
        .grid-btn img { width: 22px; height: 22px; margin-bottom: 5px; }

        .footer { margin-top: 20px; font-size: 0.6rem; opacity: 0.4; color: #fff; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

    function saveVCard() {
        const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:Kind Win\nTEL:0707140731\nEMAIL:kindwin2026@gmail.com\nEND:VCARD";
        const blob = new Blob([vcard], { type: 'text/vcard' });

        a.click();
        URL.revokeObjectURL(url);
        localStorage.setItem('kwin_contact_saved', 'true');

        if (localStorage.getItem('kwin_contact_saved') === 'true') {
            document.getElementById('mainSaveBtn').style.display = 'none';
            document.getElementById('contactSection').style.display = 'block';
        }
    }

    async function shareCard() {
        if (navigator.share) {
            try {
                await navigator.share({ title: 'K-Win', text: 'K-Win Digital Card', url: window.location.href });
            } catch (err) {}
        } else {
            alert("Sharing not supported");
        }
    }

    function injectInAppNotification() {
        if (document.getElementById('inapp-notification')) return;

        const html = `
            <div id="inapp-notification" class="inapp-notif" aria-live="polite" role="status">
                <div class="inapp-notif-top">
                    <img src="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg" class="inapp-icon" alt="K-Win">
                    <div class="inapp-meta">
                        <div class="inapp-appname">K-Win</div>
                        <div class="inapp-time" id="notif-time">Just now</div>
                    </div>
                    <button onclick="closeInAppNotification()" style="background:transparent;border:none;color:#fff;font-size:1.1rem;cursor:pointer;">✕</button>
                </div>
                <div class="inapp-title" id="notif-title">New Notification</div>
                <div class="inapp-message" id="notif-message">A new update has arrived.</div>
                <div class="inapp-actions">
                    <button class="inapp-btn close" onclick="closeInAppNotification()">Close</button>
                    <button class="inapp-btn open" onclick="openTimetable()">View</button>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', html);
    }

    function playNotifySound() {
        try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return;

            const ctx = new AudioContextClass();
            const now = ctx.currentTime;

            const o1 = ctx.createOscillator();
            const g1 = ctx.createGain();
            o1.type = 'sine';
            o1.frequency.setValueAtTime(880, now);

            g1.gain.setValueAtTime(0.0001, now);
            g1.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
            g1.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);

            o1.connect(g1);
            g1.connect(ctx.destination);
            o1.start(now);
            o1.stop(now + 0.26);

            setTimeout(() => ctx.close?.(), 400);
        } catch (e) {}
    }

    function vibrateSmall() {
        if (navigator.vibrate) navigator.vibrate(60);
    }

    function showInAppNotification(title, message) {
        injectInAppNotification();

        const notif = document.getElementById('inapp-notification');
        document.getElementById('notif-title').innerText = title || 'New Notification';
        document.getElementById('notif-message').innerText = message || '';
        document.getElementById('notif-time').innerText = 'Just now';

        notif.classList.add('show');

        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => {
            closeInAppNotification();
        }, 6000);

        playNotifySound();
        vibrateSmall();
    }

    function closeInAppNotification() {
        const notif = document.getElementById('inapp-notification');
        if (notif) notif.classList.remove('show');
        clearTimeout(hideTimer);
    }

    function initSupabase() {
        if (!window.supabase || !SUPABASE_URL || !SUPABASE_ANON_KEY) return;

        if (SUPABASE_URL.includes("YOUR_SUPABASE_PROJECT_ID")) return;

        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        sbClient
            .channel('schema-db-changes')
            .on(
                'postgres_changes',
                { event: 'INSERT', schema: 'public', table: 'notifications' },
                (payload) => {
                    const row = payload?.new || {};
                    if (!row.message) return;

                    const title = row.title || 'K-Win';
                    const message = row.message;

                    showInAppNotification(title, message);
                }
            )
            .subscribe((status) => {
                console.log('Supabase channel status:', status);
            });
    }

    function initApp() {
        setLanguage('en');
        checkStatus();
        injectInAppNotification();
        initSupabase();
    }

    document.addEventListener('DOMContentLoaded', initApp);

    // Scroll protection
    document.addEventListener('touchmove', (e) => {
        if (e.target.closest('.card')) return;
        e.preventDefault();
    }, { passive: false });

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('pwa-installer').style.display = 'block';
    });

    async function handleInstallClick() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                document.getElementById('pwa-installer').style.display = 'none';
            }
            deferredPrompt = null;
        }
    }

    // Test trigger for checking popup
    window.testKWinNotification = function() {
        showInAppNotification('K-Win', 'This is a test notification from the app.');
    };
</script>
