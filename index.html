    <style>
        :root {
            --gold: #FFD300;
            --blue: #0062ff;
            --dark-bg: #050a14;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 211, 0, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body {
            background: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        /* Animated Background Orbs */
        .orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.25; animation: move 15s infinite alternate ease-in-out; }
        .orb-gold { width: 300px; height: 300px; background: var(--gold); top: -50px; right: -50px; }
        .orb-blue { width: 400px; height: 400px; background: var(--blue); bottom: -100px; left: -50px; }
        @keyframes move { from { transform: translate(0,0); } to { transform: translate(30px, 40px); } }

        .top-bar { margin-bottom: 15px; width: 100%; display: flex; justify-content: center; }
        .lang-switch { display: flex; background: var(--glass); padding: 4px; border-radius: 50px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .lang-btn { background: none; border: none; color: #888; padding: 6px 14px; cursor: pointer; border-radius: 50px; font-size: 0.7rem; font-weight: bold; transition: 0.3s; }
        .lang-btn.active { background: var(--gold); color: #000; }

        .card {
            width: 100%; max-width: 400px; background: rgba(10, 20, 40, 0.7); backdrop-filter: blur(25px);
            border-radius: 30px; padding: 25px 18px; border: 1px solid var(--border); text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 { font-size: 1.6rem; color: #ffffff; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; font-weight: 800; }
        .subtitle { font-size: 0.6rem; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; font-weight: 600; opacity: 0.9; }

        .p-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--gold); padding: 4px; object-fit: cover; margin-bottom: 15px; box-shadow: 0 0 25px rgba(255, 211, 0, 0.2); }

        .info-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 18px; margin-bottom: 20px; text-align: left; border-left: 4px solid var(--gold); font-size: 0.8rem; line-height: 1.6; }

        .section-title { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin: 20px 0 12px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: 1.5px; }
        .section-title::before, .section-title::after { content: ""; flex: 1; height: 1px; background: rgba(255, 211, 0, 0.1); }

        /* Unified Button Styles */
        .btn-main { width: 100%; padding: 14px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-main:active { transform: scale(0.96); }

        .btn-gold { background: var(--gold); color: #000; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-glass { background: var(--glass); color: #fff; border: 1px solid var(--border); }
        
        /* Grid Layouts */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        
        .btn-wa { background: #128C7E; color: white; }
        .btn-email { background: #e74c3c; color: white; }
        .btn-call { background: #007bff; color: white; }
        .btn-sms { background: #f39c12; color: #000; }
        .btn-map { background: #ea4335; color: white; }

        /* Dropdowns */
        .dropdown { position: relative; width: 100%; }
        .dropdown-content { display: none; position: absolute; background: white; width: 100%; border-radius: 12px; z-index: 1000; bottom: 110%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .dropdown-content a { color: #000; padding: 12px; text-decoration: none; display: block; font-size: 0.85rem; border-bottom: 1px solid #eee; font-weight: 600; text-align: center; }
        .show { display: block !important; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Social Grid */
        .social-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .grid-btn { background: var(--glass); padding: 12px 5px; border-radius: 15px; text-decoration: none; color: #ccc; font-size: 0.6rem; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .grid-btn img { width: 22px; height: 22px; margin-bottom: 5px; }

        /* Overlay */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); }
        .overlay-content { background: #0a1428; width: 100%; max-width: 320px; padding: 25px; border-radius: 25px; border: 1px solid var(--gold); text-align: center; }
        .tt-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }
        
        #pwa-installer { display: none; position: fixed; top: 10px; width: 90%; max-width: 380px; background: var(--gold); color: #000; padding: 12px; border-radius: 50px; z-index: 9999; text-align: center; font-weight: 800; font-size: 0.8rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .footer { margin-top: 30px; font-size: 0.6rem; opacity: 0.4; text-align: center; color: #fff; padding-bottom: 10px; }
        html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    /* Scroll වීම සම්පූර්ණයෙන්ම නතර කරයි */
    overflow: hidden; 
    /* Mobile වලදී ඇඟිල්ලෙන් පහළට ඇද්දත් Scroll වීම වැළැක්වීමට */
    position: fixed; 
}

body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* Background image එකක් තියෙනවා නම් ඒකත් හරියට පෙනෙන්න */
    background-size: cover;
    background-position: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Card එක screen එකට වඩා ලොකු වුණොත් විතරක් card එක ඇතුළේ scroll වෙන්න මෙහෙම කරන්න පුළුවන් (Optional) */
.card {
    max-height: 95vh;
    overflow-y: auto;
    scrollbar-width: none; /* Firefox වල scrollbar එක අයින් කිරීමට */
}
.card::-webkit-scrollbar {
    display: none; /* Chrome/Safari වල scrollbar එක අයින් කිරීමට */
}

    <script>
        let currentLang = 'en';
        let deferredPrompt;

        const translations = {
            en: { 
                save: "👤 SAVE CONTACT", tt: "📅 Opening Hours", share: "SHARE", close: "❌ CLOSE", 
                addr: "📍 Kurunegala, Sri Lanka", call: "📞 Call", map: "📍 Go to Kind Win", sms: "💬 SMS", 
                footer: "✨ Powered by K-Win | Created by Janith Didula", pwa: "📲 Install K-Win App",
                hContact: "Contact Us", hSocial: "Social Media", hOther: "Other Services",
                days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"] 
            },
            si: { 
                save: "👤 CONTACT එක SAVE කරන්න", tt: "📅 විවෘතව තබන වේලාවන්", share: "SHARE කරන්න", close: "❌ වසන්න", 
                addr: "📍 කුරුණෑගල, ශ්‍රී ලංකා", call: "📞 ඇමතුම්", map: "📍  Kind Win වෙත යන මග  ", sms: "💬 පණිවිඩ", 
                footer: "✨ K-Win වෙතින් | ජනිත් දිදුලගේ නිර්මාණයකි", pwa: "📲 K-Win App එක Install කරගන්න",
                hContact: "අපව සම්බන්ධ කරගන්න", hSocial: "සමාජ මාධ්‍ය", hOther: "අමතර සේවා",
                days: ["සඳුදා", "අඟහරුවාදා", "බදාදා", "බ්‍රහස්පතින්දා", "සිකුරාදා", "සෙනසුරාදා", "ඉරිදා"] 
            },
            ta: { 
                save: "👤 தொடர்பைச் சேமிக்கவும்", tt: "📅 திறந்திருக்கும் நேரங்கள்", share: "பகிரவும்", close: "❌ மூடு", 
                addr: "📍 குருநாகல், இலங்கை", call: "📞 அழைப்பு", map: "📍 Kind Win-இற்குச் செல்லுங்கள்", sms: "💬 செய்தி", 
                footer: "✨ K-Win மூலம் | ஜனித் திதுல", pwa: "📲 K-Win செயலியை நிறுவுங்கள்",
                hContact: "எங்களைத் தொடர்பு கொள்ளுங்கள்", hSocial: "சமூக ஊடகங்கள்", hOther: "மற்றவை",
                days: ["திங்கள்", "செவ்வாய்", "புதன்", "வியාழன்", "வெள்ளி", "சனி", "ஞாயிறு"] 
            }
        };

        const timetableData = ["08:30 AM - 04:00 PM", "08:30 AM - 04:00 PM", "08:30 AM - 04:00 PM", "08:30 AM - 04:00 PM", "08:30 AM - 04:00 PM", "Closed", "08:30 AM - 04:00 PM"];

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            
            document.getElementById('txt-save').innerText = translations[lang].save;
            document.getElementById('txt-tt').innerText = translations[lang].tt;
            document.getElementById('txt-share').innerText = translations[lang].share;
            document.getElementById('txt-close').innerText = translations[lang].close;
            document.getElementById('lbl-addr').innerText = translations[lang].addr;
            document.getElementById('btn-call-txt').innerText = translations[lang].call;
            document.getElementById('btn-map-txt').innerText = translations[lang].map;
            document.getElementById('btn-sms-txt').innerText = translations[lang].sms;
            document.getElementById('txt-footer').innerText = translations[lang].footer;
            document.getElementById('pwa-text').innerText = translations[lang].pwa;
            document.getElementById('head-contact').innerText = translations[lang].hContact;
            document.getElementById('head-social').innerText = translations[lang].hSocial;
            document.getElementById('head-other').innerText = translations[lang].hOther;
        }

        function toggleMenu(id) {
            const menu = document.getElementById(id);
            const isShown = menu.classList.contains('show');
            document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));
            if (!isShown) menu.classList.add('show');
        }

        async function shareCard() {
            if (navigator.share) {
                try {
                    await navigator.share({ title: 'K-Win Digital Card', text: 'Check out K-Win Digital Card', url: window.location.href });
                } catch (err) { console.log("Share failed"); }
            } else { alert("Sharing not supported."); }
        }

        function checkContactStatus() {
            if (localStorage.getItem('kwin_contact_saved') === 'true') {
                document.getElementById('saveBtnContainer').style.display = 'none';
                document.getElementById('contactSection').style.display = 'block';
            }
        }

        function saveVCard() {
            const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:K-Win Team\nTEL:0717337818\nEMAIL:kindwin2026@gmail.com\nEND:VCARD";
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'K-Win_Contact.vcf';
            a.click();
            localStorage.setItem('kwin_contact_saved', 'true');
            checkContactStatus();
        }

        function openTimetable() {
            const list = document.getElementById('tt-list');
            list.innerHTML = '';
            timetableData.forEach((time, i) => {
                const row = document.createElement('div');
                row.className = 'tt-row';
                row.innerHTML = `<span>${translations[currentLang].days[i]}</span><span style="color:var(--gold)">${time}</span>`;
                list.appendChild(row);
            });
            document.getElementById('ttOverlay').style.display = 'flex';
        }

        function closeTimetable() { document.getElementById('ttOverlay').style.display = 'none'; }

        window.onload = () => { setLanguage('si'); checkContactStatus(); };

        window.onclick = (e) => {
            if (!e.target.matches('.btn-main')) {
                document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));
            }
        };

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-installer').style.display = 'block';
        });

        async function handleInstallClick() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('pwa-installer').style.display = 'none';
                deferredPrompt = null;
            }
        }
        // Screen එක Touch කරලා ඇදීමේදී (Scrolling) සිදුවන ක්‍රියාවලිය නතර කරයි
document.addEventListener('touchmove', function(e) {
    e.preventDefault();
}, { passive: false });
    </script>
</body>
</html>
