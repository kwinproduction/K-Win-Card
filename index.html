    <style>
        :root {
            --primary-accent: #00f2ff; /* Electric Cyan */
            --blue: #0062ff;
            --dark-bg: #050a14;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(0, 242, 255, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; position: fixed;
        }

        body {
            background: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Background Orbs */
        .orb { position: fixed; border-radius: 50%; filter: blur(80px); z-index: -1; opacity: 0.15; animation: move 15s infinite alternate ease-in-out; }
        .orb-1 { width: 300px; height: 300px; background: var(--primary-accent); top: -50px; right: -50px; }
        .orb-2 { width: 400px; height: 400px; background: var(--blue); bottom: -100px; left: -50px; }
        @keyframes move { from { transform: translate(0,0); } to { transform: translate(30px, 40px); } }

        .top-bar { margin-bottom: 10px; width: 100%; display: flex; justify-content: center; z-index: 10; }
        .lang-switch { display: flex; background: var(--glass); padding: 4px; border-radius: 50px; border: 1px solid var(--border); backdrop-filter: blur(10px); }
        .lang-btn { background: none; border: none; color: #888; padding: 6px 14px; cursor: pointer; border-radius: 50px; font-size: 0.7rem; font-weight: bold; transition: 0.3s; }
        .lang-btn.active { background: var(--primary-accent); color: #000; }

        .card {
            width: 90%; max-width: 380px; background: rgba(10, 20, 40, 0.7); backdrop-filter: blur(25px);
            border-radius: 30px; padding: 20px 18px; border: 1px solid var(--border); text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-height: 85vh; overflow-y: auto; scrollbar-width: none;
            position: relative; padding-bottom: 30px;
        }
        .card::-webkit-scrollbar { display: none; }

        h1 { font-size: 1.6rem; color: #ffffff; letter-spacing: 1px; margin-bottom: 15px; text-transform: uppercase; font-weight: 800; }
        .p-img { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--primary-accent); padding: 4px; object-fit: cover; margin-bottom: 15px; }

        .info-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 18px; margin-bottom: 15px; text-align: left; border-left: 4px solid var(--primary-accent); font-size: 0.8rem; line-height: 1.6; }

        .section-title { font-size: 0.75rem; color: var(--primary-accent); margin: 15px 0 10px; font-weight: 700; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 10px; letter-spacing: 1.5px; opacity: 0.7; }
        .section-title::before, .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

        .btn-main { width: 100%; padding: 12px; border-radius: 15px; border: none; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
        .btn-main:active { transform: scale(0.96); }

        .btn-accent { background: var(--primary-accent); color: #000; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-glass { background: var(--glass); color: #fff; border: 1px solid var(--border); }
        .btn-wa { background: #128C7E; color: white; }
        .btn-map { background: #34a853; color: white; }

        /* Dropdowns Drop Downwards to avoid overflow cuts */
        .dropdown { position: relative; width: 100%; }
        .dropdown-content { display: none; position: absolute; background: white; width: 100%; border-radius: 12px; z-index: 1000; top: 105%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .dropdown-content a { color: #000; padding: 12px; text-decoration: none; display: block; font-size: 0.85rem; border-bottom: 1px solid #eee; font-weight: 600; text-align: center; }
        .show { display: block !important; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .social-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .grid-btn { background: var(--glass); padding: 10px 5px; border-radius: 15px; text-decoration: none; color: #ccc; font-size: 0.6rem; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; }
        .grid-btn img { width: 22px; height: 22px; margin-bottom: 5px; }

        #pwa-installer { display: none; position: fixed; top: 10px; width: 90%; max-width: 380px; background: var(--primary-accent); color: #000; padding: 12px; border-radius: 50px; z-index: 9999; text-align: center; font-weight: 800; font-size: 0.8rem; box-shadow: 0 10px 20px rgba(0,0,0,0.3); cursor: pointer; }
        .footer { margin-top: 20px; font-size: 0.6rem; opacity: 0.4; color: #fff; }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* Mobile-style Push Notification Banner */
        .notif-banner {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 360px; background: rgba(10, 25, 50, 0.95);
            border: 1px solid var(--primary-accent); border-radius: 20px;

            box-shadow: 0 15px 35px rgba(0, 242, 255, 0.2); z-index: 100000;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(15px);

        .notif-banner.popup-show { top: 15px; }
        .notif-icon { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--primary-accent); background: #000; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

        .notif-msg { font-size: 0.75rem; color: #ffffff; line-height: 1.3; }
    </style>
</head>

            const menu = document.getElementById(id);
            const isShown = menu.classList.contains('show');
            document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));

        function closeTimetable() {
            const overlay = document.getElementById('tt-overlay');

        function saveVCard() {
            const vcard = "BEGIN:VCARD\r\nVERSION:3.0\r\nFN:Kind Win\r\nTEL;TYPE=CELL,VOICE:0717337818\r\nEMAIL;TYPE=PREF,INTERNET:kindwin2026@gmail.com\r\nEND:VCARD";
            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });

            document.body.removeChild(a);

            } else { alert("Sharing not supported on this browser."); }

        // Functions to trigger and show Push Notification UI
        function triggerInAppNotification(title, message) {
            const banner = document.getElementById('app-notification');
            document.getElementById('notif-title').innerText = title;
            document.getElementById('notif-msg').innerText = message;
            
            banner.classList.add('popup-show');
            
            // Auto hide after 4.5 seconds
            setTimeout(() => {
                banner.classList.remove('popup-show');
            }, 4500);
        }

        // Initialize Supabase and Real-time Listeners
        function initSupabase() {
            if(SUPABASE_URL.includes("YOUR_SUPABASE_PROJECT_ID")) {
                console.log("Supabase config template remains unchanged.");
                return;
            }
            
            try {
                // Initialize Client
                supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // Listen to 'notifications' table inserts in real-time
                supabase
                    .channel('schema-db-changes')
                    .on(
                        'postgres_changes',
                        { event: 'INSERT', schema: 'public', table: 'notifications' },
                        (payload) => {
                            if(payload.new && payload.new.message) {
                                const title = payload.new.title || "K-WIN UPDATE";
                                triggerInAppNotification(title, payload.new.message);
                            }
                        }
                    )
                    .subscribe();
            } catch (error) {
                console.error("Supabase Initialization Error:", error);
            }
        }

            checkStatus();

            document.getElementById('pwa-installer').style.display = 'block';
        });

        async function handleInstallClick() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('pwa-installer').style.display = 'none';
                deferredPrompt = null;
            }
        }
    </script>
</body>
</html>
