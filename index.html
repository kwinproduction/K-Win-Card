/* Football */
.ball{
    position:absolute;
    width:90px;
    height:90px;
    font-size:90px;
    animation:rollBall 3s ease-in-out forwards;
}

@keyframes rollBall{
    0%{
        left:-120px;
        transform:rotate(0deg);
    }
    70%{
        left:calc(50% - 45px);
        transform:rotate(1080deg);
    }
    100%{
        left:calc(50% - 45px);
        transform:rotate(1440deg) scale(0);
        opacity:0;
    }
}

/* Kind Win */
h1{
    color:#FFD700; /* ඔයාගේ පාටම */
    font-size:70px;
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;

    width:0;
    overflow:hidden;
    white-space:nowrap;
    border-right:4px solid #FFD700;

    opacity:0;

    animation:
        showText 0.1s forwards 2.9s,
        typing 2s steps(8,end) forwards 3s,
        blink .6s infinite 3s;
}

@keyframes showText{
    to{
        opacity:1;
    }
}

@keyframes typing{
    from{width:0}
    to{width:420px}
}

@keyframes blink{
    50%{
        border-color:transparent;
    }
}

        function saveVCard() {
            const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:Kind Win\nTEL:0707140731\nEMAIL:kindwin2026@gmail.com\nEND:VCARD";
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'KindWin_Contact.vcf';
            a.click();
            localStorage.setItem('kwin_contact_saved', 'true');
            checkStatus();
        }

        function checkStatus() {
            if (localStorage.getItem('kwin_contact_saved') === 'true') {
                document.getElementById('mainSaveBtn').style.display = 'none';
                document.getElementById('contactSection').style.display = 'block';
            }
        }

        async function shareCard() {
            if (navigator.share) {
                try {
                    await navigator.share({ title: 'K-Win', text: 'K-Win Digital Card', url: window.location.href });
                } catch (err) {}
            } else { alert("Sharing not supported"); }
        }

        window.onload = () => { 
            setLanguage('en'); 
            checkStatus(); 
        };

        // Scroll protection
        document.addEventListener('touchmove', (e) => { if(e.target.closest('.card')) return; e.preventDefault(); }, { passive: false });

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-installer').style.display = 'block';
        });

        async function handleInstallClick() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('pwa-installer').style.display = 'none';
                deferredPrompt = null;
            }
        }
        function playWelcomeSound(){

 const ctx = new(window.AudioContext||window.webkitAudioContext)();

 const osc = ctx.createOscillator();
 const gain = ctx.createGain();

 osc.type="sine";
 osc.frequency.value=900;

 osc.connect(gain);
 gain.connect(ctx.destination);

 gain.gain.setValueAtTime(0.08,ctx.currentTime);

 osc.start();

 setTimeout(()=>{
   osc.stop();
   ctx.close();
 },250);

}
