<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Win Digital Card</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiS1dpbiIsInNob3J0X25hbWUiOiJLLVdpbiIsInN0YXJ0X3VybCI6ImluZGV4Lmh0bWwiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3ciOiIjMGExOTJmIiwidGhlbWVfY29sb3ciOiIjZmZkYTAwIiwib3JpZW50YXRpb24iOiJwb3J0cmFpdCIsImljb25zIjpbeyJzcmMiOiJodHRwczovL3Jhdy5naXRodWJ1c2VyY29udGVudC5jb20va3dpbnByb2R1Y3Rpb24vSy1XaW4tRWNhcmQvbWFpbi9sb2dvLmpwZWciLCJzaXplcyI6IjUxMng1MTIiLCJ0eXBlIjoiaW1hZ2UvanBlZyIsInB1cnBvc2UiOiJhbnkgbWFza2FibGUifV19">
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg">
    <meta name="theme-color" content="#ffda00">    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { 
            --gold: #ffda00; 
            --white: #ffffff; 
            --dark-blue: #0a192f; 
            --bg-dark: #050a14;
            --glass: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 218, 0, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
        
        body, html { 
            min-height: 100%; width: 100%; 
            background: var(--bg-dark); 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        body { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 30px 20px;
        }

        /* Background Orbs */
        .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.2; z-index: -1; }
        .orb-1 { width: 300px; height: 300px; background: var(--gold); top: -50px; left: -50px; }
        .orb-2 { width: 300px; height: 300px; background: #007bff; bottom: -50px; right: -50px; }

        /* Language Switch */
        .lang-switch { display: flex; gap: 8px; background: var(--glass); padding: 5px; border-radius: 50px; margin-bottom: 25px; border: 1px solid var(--border); }
        .lang-btn { background: none; border: none; color: #8892b0; padding: 8px 16px; border-radius: 50px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: var(--gold); color: #000; }

        /* Card Design */
        .card { 
            width: 100%; max-width: 380px; 
            background: rgba(10, 25, 47, 0.7);
            padding: 30px 20px; border-radius: 40px; 
            border: 1px solid var(--border); 
            text-align: center; position: relative;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .p-img { 
            width: 100px; height: 100px; border-radius: 50%; 
            border: 3px solid var(--gold); padding: 4px; 
            object-fit: cover; margin-bottom: 15px;
        }

        h1 { font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 5px; font-weight: 800; color: var(--gold); text-transform: uppercase; }
        .subtitle { font-size: 0.75rem; color: #aaa; letter-spacing: 1px; margin-bottom: 20px; text-transform: uppercase; }

        .info-box { 
            background: rgba(0,0,0,0.3); padding: 15px; border-radius: 20px; 
            margin: 15px 0; text-align: left; font-size: 0.85rem; 
            border: 1px solid var(--border); line-height: 1.8;
            border-left: 4px solid var(--gold);
        }

        /* Buttons */
        .btn { transition: all 0.2s ease; cursor: pointer; border: none; font-weight: bold; }
        .btn:active { transform: scale(0.96); }

        .btn-save { 
            width: 100%; padding: 16px; border-radius: 18px; 
            background: var(--gold); color: #000; font-size: 1rem; 
            margin-bottom: 15px; box-shadow: 0 10px 20px rgba(255, 218, 0, 0.2);
        }
        
        .btn-tt { 
            width: 100%; padding: 14px; border-radius: 18px; 
            background: transparent; color: var(--gold); font-size: 0.9rem; 
            border: 1px solid var(--gold); margin-top: 5px;
        }

        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin-top: 5px; }
        .btn-action { padding: 14px; border-radius: 18px; color: white; font-size: 0.85rem; }
        .btn-wa { background: #25D366; } 
        .btn-call { background: #007bff; } 
        .btn-sms { background: #f39c12; color: #000; } 
        .btn-email { background: #e74c3c; }

        /* Social Grid */
        .social-grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 12px; margin-top: 25px; width: 100%; 
        }
        .grid-btn { 
            display: flex; flex-direction: column; align-items: center; 
            background: var(--glass); padding: 12px 5px; border-radius: 18px; 
            text-decoration: none; color: #ccc; font-size: 0.65rem; 
            border: 1px solid rgba(255,255,255,0.1);
        }
        .grid-btn img { width: 22px; height: 22px; margin-bottom: 8px; }

        /* Timetable Overlay */
        .tt-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .tt-content { background: var(--dark-blue); width: 85%; max-width: 340px; padding: 25px; border-radius: 30px; border: 1px solid var(--gold); }
        .tt-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,218,0,0.1); font-size: 0.8rem; }
        .close-tt { background: var(--gold); color: #000; width: 100%; padding: 12px; border: none; border-radius: 15px; margin-top: 20px; font-weight: bold; cursor: pointer; }

        /* Dropdowns */
        .dropdown { position: relative; width: 100%; }
        .dropdown-content { display: none; position: absolute; background: white; width: 100%; border-radius: 15px; z-index: 99; bottom: 110%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
        .dropdown-content a { color: #000; padding: 14px; text-decoration: none; display: block; font-size: 0.85rem; border-bottom: 1px solid #eee; text-align: center; font-weight: bold; }
        .show { display: block !important; }

        /* Branding Footer */
        .footer-branding { margin-top: 30px; text-align: center; opacity: 0.7; }
        .created-by { font-size: 0.7rem; color: #fff; font-weight: 400; letter-spacing: 0.5px; }

        /* Installer Bar */
        #pwa-installer { 
            display: none; position: fixed; top: 10px; width: 90%; max-width: 360px; 
            background: rgba(0,0,0,0.9); padding: 15px; border-radius: 15px; 
            z-index: 9999; border: 1px solid var(--gold); text-align: center;
        }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div id="pwa-installer">
        <span style="font-size:0.85rem; display:block; margin-bottom:10px;">📲 K-Win App එක Install කරගන්න</span>
        <button onclick="handleInstallClick()" style="background:var(--gold); color:#000; border:none; padding:10px 20px; border-radius:10px; cursor:pointer; font-weight:bold; width:100%;">Install Now</button>
    </div>

    <div class="lang-switch">
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">English</button>
        <button id="btn-si" class="lang-btn active" onclick="setLanguage('si')">සිංහල</button>
        <button id="btn-ta" class="lang-btn" onclick="setLanguage('ta')">தமிழ்</button>
    </div>

    <div class="card">
        <h1>K-Win Team</h1>
        <div class="subtitle">Digital Business Card</div>
        
        <img src="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg" class="p-img" alt="K-Win Logo">
        
        <div class="info-box">
            <span id="lbl-addr">📍 Kurunegala, Sri Lanka</span><br>
            <span id="lbl-phone">📞 071 733 7818</span><br>
            <span id="lbl-email">📧 kindwin2026@gmail.com</span>
        </div>

        <button id="mainSaveBtn" onclick="saveVCard()" class="btn btn-save">👤 SAVE CONTACT</button>

        <div id="actionGrid" class="action-grid" style="display: none;">
            <button class="btn btn-action btn-wa" onclick="window.location.href='https://wa.me/94717337818'">WhatsApp</button>
            <div class="dropdown">
                <button class="btn btn-action btn-call" id="btn-call-txt" onclick="toggleMenu('callMenu')">Call</button>
                <div id="callMenu" class="dropdown-content">
                    <a href="tel:0717337818">071 733 7818</a>
                    <a href="tel:0767902944">076 790 2944</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="btn btn-action btn-sms" id="btn-sms-txt" onclick="toggleMenu('smsMenu')">SMS</button>
                <div id="smsMenu" class="dropdown-content">
                    <a href="sms:0717337818">071 733 7818</a>
                    <a href="sms:0767902944">076 790 2944</a>
                </div>
            </div>
            <button class="btn btn-action btn-email" id="btn-email-txt" onclick="window.location.href='mailto:kindwin2026@gmail.com'">Email</button>
        </div>

        <button onclick="openTimetable()" class="btn btn-tt">📅 <span id="btn-tt-txt">Opening Hours</span></button>

        <div class="social-grid">
            <a href="https://www.facebook.com/profile.php?id=61569786773421" class="grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"><span>Facebook</span></a>
            <a href="#" class="grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"><span>YouTube</span></a>
            <a href="#" class="grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"><span>TikTok</span></a>
            <a href="#" class="grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"><span>Instagram</span></a>
        </div>
    </div>

    <div id="ttOverlay" class="tt-overlay">
        <div class="tt-content">
            <h3 id="tt-title" style="color: var(--gold); text-align: center; margin-bottom: 15px;">⏰ Weekly Timetable</h3>
            <div id="tt-list"></div>
            <button class="close-tt" onclick="closeTimetable()">CLOSE</button>
        </div>
    </div>

    <div class="footer-branding">
        <div class="created-by" id="lbl-credit">Powered by K-Win | Designed by Janith Didula</div>
    </div>

    <script>
        let currentLang = 'si';
        let deferredPrompt;

        const translations = {
            en: { save: "👤 SAVE CONTACT", ttBtn: "Opening Hours", ttTitle: "⏰ Opening Hours", addr: "📍 Kurunegala, Sri Lanka", call: "Call", sms: "SMS", email: "Email", close: "CLOSE", credit: "Powered by K-Win | Designed by Janith Didula", days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"], open: "Open", closed: "Closed" },
            si: { save: "👤 CONTACT එක SAVE කරන්න", ttBtn: "විවෘතව තබන වේලාවන්", ttTitle: "⏰ විවෘතව තබන වේලාවන්", addr: "📍 කුරුණෑගල, ශ්‍රී ලංකා", call: "ඇමතුම්", sms: "පණිවිඩ", email: "ඊමේල්", close: "වසන්න", credit: "K-Win වෙතින් | ජනිත් දිදුලගේ නිර්මාණයකි", days: ["සඳුදා", "අඟහරුවාදා", "බදාදා", "බ්‍රහස්පතින්දා", "සිකුරාදා", "සෙනසුරාදා", "ඉරිදා"], open: "විවෘතයි", closed: "වසා ඇත" },
            ta: { save: "👤 தொடர்பைச் சேமிக்கவும்", ttBtn: "திறந்திருக்கும் நேரங்கள்", ttTitle: "⏰ திறந்திருக்கும் நேரங்கள்", addr: "📍 குருநாகல், இலங்கை", call: "அழைப்பு", sms: "செய்தி", email: "மின்னஞ்சல்", close: "மூடு", credit: "K-Win மூலம் இயக்கப்படுகிறது | Janith Didula", days: ["திங்கள்", "செவ்வாய்", "புதன்", "வியாழன்", "வெள்ளி", "சனி", "ஞாயிறு"], open: "திறந்துள்ளது", closed: "மூடப்பட்டுள்ளது" }
        };

        const timetableData = [
            { time: "08:30 AM - 04:00 PM", status: "open" },
            { time: "08:30 AM - 04:00 PM", status: "open" },
            { time: "08:30 AM - 04:00 PM", status: "open" },
            { time: "08:30 AM - 04:00 PM", status: "open" },
            { time: "08:30 AM - 04:00 PM", status: "open" },
            { time: "Closed", status: "closed" },
            { time: "08:30 AM - 04:00 PM", status: "open" }
        ];

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            
            document.getElementById('mainSaveBtn').innerText = translations[lang].save;
            document.getElementById('lbl-addr').innerText = translations[lang].addr;
            document.getElementById('btn-tt-txt').innerText = translations[lang].ttBtn;
            document.getElementById('btn-call-txt').innerText = translations[lang].call;
            document.getElementById('btn-sms-txt').innerText = translations[lang].sms;
            document.getElementById('btn-email-txt').innerText = translations[lang].email;
            document.getElementById('tt-title').innerText = translations[lang].ttTitle;
            document.getElementById('lbl-credit').innerText = translations[lang].credit;
            document.querySelector('.close-tt').innerText = translations[lang].close;
        }

        function toggleMenu(id) {
            const menu = document.getElementById(id);
            const isShown = menu.classList.contains('show');
            document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));
            if (!isShown) menu.classList.add('show');
        }

        function openTimetable() {
            const list = document.getElementById('tt-list');
            list.innerHTML = '';
            timetableData.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'tt-row';
                const statusText = item.status === 'open' ? item.time : translations[currentLang].closed;
                row.innerHTML = `<span>${translations[currentLang].days[index]}</span><span>${statusText}</span>`;
                list.appendChild(row);
            });
            document.getElementById('ttOverlay').style.display = 'flex';
        }

        function closeTimetable() { document.getElementById('ttOverlay').style.display = 'none'; }

        function saveVCard() {
            const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:K-Win Team\nTEL:0717337818\nEMAIL:kindwin2026@gmail.com\nEND:VCARD";
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'K-Win_Contact.vcf';
            a.click();
            localStorage.setItem('contact_saved', 'true');
            showActionGrid();
        }

        function showActionGrid() {
            document.getElementById('mainSaveBtn').style.display = 'none';
            document.getElementById('actionGrid').style.display = 'grid';
        }

        // PWA Logic
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-installer').style.display = 'block';
        });

        async function handleInstallClick() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('pwa-installer').style.display = 'none';
                deferredPrompt = null;
            }
        }

        window.onload = () => {
            setLanguage('si');
            if (localStorage.getItem('contact_saved') === 'true') showActionGrid();
        };

        window.onclick = (e) => {
            if (!e.target.matches('.btn-action')) {
                document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));
            }
        };
    </script>
</body>
</html>
