<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>K-Win</title>

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiS1dpbiIsInNob3J0X25hbWUiOiJLLVdpbiIsInN0YXJ0X3VybCI6ImluZGV4Lmh0bWwiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3ciOiIjMDAwMDAwIiwidGhlbWVfY29sb3ciOiIjZmZmZmZmIiwib3JpZW50YXRpb24iOiJwb3J0cmFpdCIsImljb25zIjpbeyJzcmMiOiJodHRwczovL3Jhdy5naXRodWJ1c2VyY29udGVudC5jb20va3dpbnByb2R1Y3Rpb24vSy1XaW4tRWNhcmQvbWFpbi9sb2dvLmpwZWciLCJzaXplcyI6IjUxMng1MTIiLCJ0eXBlIjoiaW1hZ2UvanBlZyIsInB1cnBvc2UiOiJhbnkgbWFza2FibGUifV19">
    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg">
    <meta name="theme-color" content="#000000">    
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root { 
            --primary: #ffffff; 
            --accent: #ffffff;
            --bg-black: #000000; /* Pure Black Background as requested */
            --glass: rgba(255, 255, 255, 0.08); 
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Fixed full-screen layout */
        body, html { 
            height: 100dvh; /* Dynamic viewport height for mobile */
            width: 100%;
            background: var(--bg-black); 
            color: white; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden; /* Prevents unwanted scrolling */
        }

        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom) 10px; 
        }

        /* Install Banner */
        #install-banner {
            display: none; position: fixed; top: 0; left: 0; width: 100%;
            background: #fff; color: #000; padding: 12px; z-index: 10002;
            justify-content: space-between; align-items: center; font-weight: bold;
            box-shadow: 0 4px 10px rgba(255,255,255,0.1);
        }
        #install-banner button { background: #000; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; }

        .card { 
            width: 100%; max-width: 380px; background: rgba(255, 255, 255, 0.03); 
            padding: 20px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(20px); text-align: center; position: relative;
        }

        .p-img { width: 85px; height: 85px; border-radius: 50%; border: 2px solid var(--primary); padding: 3px; object-fit: cover; margin-bottom: 5px; }
        .info-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; margin: 10px 0; border-left: 3px solid var(--accent); text-align: left; font-size: 0.8rem; line-height: 1.6; }
        
        .btn { transition: all 0.1s ease; cursor: pointer; border: none; outline: none; }
        .btn:active { transform: scale(0.95); }

        .btn-save { width: 100%; padding: 12px; border-radius: 15px; font-weight: bold; background: var(--primary); color: #000; font-size: 0.9rem; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 10px; }
        .btn-action { padding: 12px 5px; font-size: 0.8rem; border-radius: 15px; color: white; font-weight: bold; }
        .btn-wa { background: #25D366; } .btn-call { background: #ffffff; color: #000; } .btn-sms { background: #007aff; } .btn-email { background: #444; }

        .social-button-container { display: flex; gap: 8px; width: 100%; margin: 15px 0 5px 0; }
        .location-btn { display: flex; align-items: center; justify-content: center; gap: 5px; padding: 10px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 0.8rem; flex: 1; }
        
        .social-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; width: 100%; }
        .grid-btn { display: flex; flex-direction: column; align-items: center; background: var(--glass); padding: 10px 5px; border-radius: 12px; text-decoration: none; color: white; font-size: 0.6rem; border: 1px solid rgba(255,255,255,0.05); }
        .grid-btn img { width: 20px; height: 20px; margin-bottom: 5px; filter: grayscale(1) invert(1); }

        .lang-switch { display: flex; gap: 5px; background: var(--glass); padding: 4px; border-radius: 50px; margin-bottom: 15px; }
        .lang-btn { background: none; border: none; color: #888; padding: 6px 12px; cursor: pointer; border-radius: 50px; font-size: 0.7rem; }
        .lang-btn.active { background: #fff; color: #000; font-weight: bold; }

        .dropdown-content { display: none; position: absolute; background: white; width: 100%; border-radius: 12px; z-index: 99; bottom: 110%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .dropdown-content a { color: #000; padding: 10px; text-decoration: none; display: block; font-size: 0.75rem; border-bottom: 1px solid #eee; }
        .show { display: block !important; }

        #ios-prompt { display: none; position: fixed; bottom: 20px; background: #fff; color: #000; padding: 15px; border-radius: 15px; z-index: 10001; text-align: center; font-size: 13px; width: 90%; font-weight: bold; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
    </style>
</head>
<body>

    <div id="install-banner">
        <span>Install K-Win App</span>
        <button onclick="installPWA()">INSTALL</button>
    </div>

    <div class="lang-switch">
        <button id="btn-en" class="lang-btn" onclick="setLanguage('en')">ENGLISH</button>
        <button id="btn-si" class="lang-btn active" onclick="setLanguage('si')">සිංහල</button>
        <button id="btn-ta" class="lang-btn" onclick="setLanguage('ta')">தமிழ்</button>
    </div>

    <div class="card">
        <h1 style="margin:0 0 10px 0; font-size: 1.4rem; letter-spacing: 2px;">KIND WIN</h1>
        <img src="https://raw.githubusercontent.com/kwinproduction/K-Win-Ecard/main/logo.jpeg" class="p-img" alt="Profile">
        
        <div class="info-box">
            <span id="lbl-addr">📍 Kurunegala, Sri Lanka</span><br>
            <span id="lbl-phone">📞 071 733 7818</span><br>
            <span id="lbl-email">📧 kindwin2026@gmail.com</span>
        </div>

        <button id="mainSaveBtn" onclick="saveVCard()" class="btn btn-save">👤 SAVE CONTACT</button>

        <div id="actionGrid" class="action-grid" style="display: none;">
            <button class="btn btn-action btn-wa" onclick="window.location.href='https://wa.me/94717337818'">WhatsApp</button>
            <div style="position:relative">
                <button class="btn btn-action btn-call" id="btn-call-txt" onclick="toggleMenu('callMenu')">Call</button>
                <div id="callMenu" class="dropdown-content">
                    <a href="tel:0717337818">Sadeepa</a>
                    <a href="tel:0714073730">Kevin</a>
                </div>
            </div>
            <div style="position:relative">
                <button class="btn btn-action btn-sms" id="btn-sms-txt" onclick="toggleMenu('smsMenu')">SMS</button>
                <div id="smsMenu" class="dropdown-content">
                    <a href="sms:0717337818">Sadeepa</a>
                    <a href="sms:0714073730">Kevin</a>
                </div>
            </div>
            <button class="btn btn-action btn-email" id="btn-email-txt" onclick="window.location.href='mailto:kindwin2026@gmail.com'">Email</button>
        </div>

        <div class="social-button-container">
            <a id="loc-btn" href="https://maps.app.goo.gl/c3tWuHNQDBGwbK5g8" class="btn location-btn" style="background: #fff; color: #000;">
                <span id="loc-txt">Go to Kind Win </span>
            </a>
            <button id="share-btn" class="btn location-btn" onclick="shareApp()" style="background: #222; color: #fff;">
                <span id="share-txt">Share</span>
            </button>
        </div>

        <div class="social-grid">
            <a href="javascript:void(0)" onclick="openSocial('fb')" class="btn grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"><span>Facebook</span></a>
            <a href="javascript:void(0)" onclick="openSocial('yt')" class="btn grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"><span>YouTube</span></a>
            <a href="javascript:void(0)" onclick="openSocial('tt')" class="btn grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"><span>TikTok</span></a>
            <a href="javascript:void(0)" onclick="openSocial('ig')" class="btn grid-btn"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"><span>Instagram</span></a>
        </div>
    </div>

    <div id="ios-prompt">
        Tap <img src="https://cdn-icons-png.flaticon.com/512/54/54720.png" style="width:16px; vertical-align:middle;"> then <b>'Add to Home Screen'</b>
    </div>

    <script>
        let deferredPrompt;
        let currentLang = 'en';

        const translations = {
            en: { save: "👤 SAVE CONTACT", addr: "📍 Kurunegala, Sri Lanka", call: "Call", sms: "SMS", email: "Email", locTxt: "Go to Kind Win", shareTxt: "Share" },
            si: { save: "👤 CONTACT එක SAVE කරන්න", addr: "📍 කුරුණෑගල, ශ්‍රී ලංකා", call: "ඇමතුම්", sms: "පණිවිඩ", email: "ඊමේල්", locTxt: "Kind Win ට යන මග", shareTxt: "බෙදාගන්න" },
            ta: { save: "👤 தொடர்பைச் சேமிக்கவும்", addr: "📍 குருநாகல், இலங்கை", call: "அழைப்பு", sms: "செய்தி", email: "Kind Win மின்னஞ்சல்", locTxt: "இருப்பிடம்", shareTxt: "பகிர்" }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + lang).classList.add('active');
            document.getElementById('mainSaveBtn').innerText = translations[lang].save;
            document.getElementById('lbl-addr').innerText = translations[lang].addr;
            document.getElementById('btn-call-txt').innerText = translations[lang].call;
            document.getElementById('btn-sms-txt').innerText = translations[lang].sms;
            document.getElementById('btn-email-txt').innerText = translations[lang].email;
            document.getElementById('loc-txt').innerText = translations[lang].locTxt;
            document.getElementById('share-txt').innerText = translations[lang].shareTxt;
        }

        function toggleMenu(id) {
            const menu = document.getElementById(id);
            const isShown = menu.classList.contains('show');
            document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));
            if (!isShown) menu.classList.add('show');
        }

        function saveVCard() {
            const vcard = "BEGIN:VCARD\nVERSION:3.0\nFN:K-Win\nTEL:0717337818\nEMAIL:kindwin2026@gmail.com\nEND:VCARD";
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'K-Win_Contact.vcf';
            a.click();
            localStorage.setItem('contact_saved', 'true');
            showActionGrid();
        }

        function showActionGrid() {
            document.getElementById('mainSaveBtn').style.display = 'none';
            document.getElementById('actionGrid').style.display = 'grid';
        }

        // PWA Install Logic
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('install-banner').style.display = 'flex';
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') document.getElementById('install-banner').style.display = 'none';
                    deferredPrompt = null;
                });
            }
        }

        async function shareApp() {
            const shareData = { title: 'K-Win', text: 'Kind Win Digital Card', url: window.location.href };
            try {
                if (navigator.share) await navigator.share(shareData);
                else {
                    navigator.clipboard.writeText(window.location.href);
                    alert("Link Copied!");
                }
            } catch (err) { console.log(err); }
        }

        function openSocial(type) {
            let webUrl = type === 'fb' ? 'https://www.facebook.com/profile.php?id=61569786773421' : 'https://google.com';
            window.location.href = webUrl;
        }

        window.onload = () => {
            setLanguage('si');
            if (localStorage.getItem('contact_saved') === 'true') showActionGrid();
            
            // iOS Prompt
            const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
            const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
            if (isIos && !isStandalone) {
                setTimeout(() => { document.getElementById('ios-prompt').style.display = 'block'; }, 3000);
            }
        };

        window.onclick = (e) => {
            if (!e.target.matches('.btn-action')) {
                document.querySelectorAll('.dropdown-content').forEach(m => m.classList.remove('show'));
            }
        };
    </script>
</body>
</html>
